[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yaskabane-autoplan_jd112"
version = "0.1.0"
description = "解析时间标记，排列自动驾驶规划控制专家·投机解码的命中率的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yaskabane" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yaskabane.github.io"
Repository = "https://github.com/yaskabane/autoplan_jd112"
Issues = "https://github.com/yaskabane/autoplan_jd112/issues"

[project.scripts]
autoplan_jd112 = "autoplan_jd112:main"

[tool.setuptools]
py-modules = ["autoplan_jd112"]
